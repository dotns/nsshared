# typos-cli configuration.
#
# Keep the allowlist empty for now; extend as project-specific spellings or
# proper nouns surface as false positives.

[default]
# Base64 thumbprint fixture in envelope_pins tokenizes to fragments that the
# default dictionary may rewrite. Anchor the ignore on the distinctive prefix
# so real typos elsewhere still fail.
extend-ignore-identifiers-re = [
    "P7IdLIpiTZiFaIoOSqbX[A-Za-z0-9]*",
    # Bare hex commit ids (short or full) tokenize into fragments ("ba",
    # "5e0") that the dictionary rewrites; ignore hex-only identifiers of
    # commit-id length.
    "\\b[0-9a-f]{7,40}\\b",
]

[files]
extend-exclude = [
    "Cargo.lock",
    "target/",
    # Generated fixtures; their base64url JSON values tokenize into dictionary words.
    "crates/ns-rendezvous/tests/fixtures/vectors/",
]
