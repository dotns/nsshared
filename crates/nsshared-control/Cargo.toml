[package]
name = "nsshared-control"
description = "NS shared control contracts: M6 service control and Node control v2, with the candidate account payload contracts behind the unstable-account feature"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
# The candidate account payload contracts (`account`). Not covered by semver:
# they may change incompatibly before the gate is removed.
unstable-account = ["dep:base64", "dep:ed25519-dalek", "dep:hmac", "dep:idna", "dep:serde", "dep:serde_json"]

[dependencies]
base64 = { workspace = true, optional = true }
blake2.workspace = true
ed25519-dalek = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
idna = { version = "1.1.0", optional = true }
nsshared-codec.workspace = true
nsshared-identity.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, features = ["raw_value"], optional = true }
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
base64.workspace = true
blake2.workspace = true
ed25519-dalek.workspace = true
hmac.workspace = true
nsshared-codec.workspace = true
nsshared-identity.workspace = true
nsshared-rendezvous.workspace = true
nsshared-testkit.workspace = true
proptest.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true

[[test]]
name = "account"
path = "tests/account/main.rs"
required-features = ["unstable-account"]

[lints]
workspace = true
