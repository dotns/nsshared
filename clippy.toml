# Per-lint clippy configuration. Lint LEVELS live in Cargo.toml's
# `[workspace.lints]`; this file holds per-lint config only.
#
# Test code may use the ergonomic panic helpers freely — the panic-safety
# lints (`unwrap_used` / `expect_used` / `panic`) apply to production paths.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests  = true
