[workspace]
resolver = "3"
members = [
    "crates/nsshared-proto",
    "crates/nsshared-telemetry",
    "examples/mock-relay",
    "examples/mock-rendezvous",
    "examples/mock-server",
]

# ============================================================================
# Workspace lint policy (pma-rust baseline). Each crate opts in with
# `[lints] workspace = true`; per-lint test exemptions live in clippy.toml.
# ============================================================================
[workspace.lints.rust]
warnings    = { level = "deny", priority = -2 }
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic       = "deny"
todo        = "warn"

[workspace.package]
edition = "2024"
rust-version = "1.96"
version = "0.2.0"
license = "MIT"
authors = ["NSIO Project Contributors"]
publish = false

[workspace.dependencies]
# Internal crates.
nsshared-mock-relay = { path = "examples/mock-relay", version = "0.2.0" }
nsshared-mock-rendezvous = { path = "examples/mock-rendezvous", version = "0.2.0" }
nsshared-proto = { path = "crates/nsshared-proto", version = "0.2.0" }

# External crates: latest stable versions as of 2026-10-02.
base64           = "0.23.1"
blake2           = "0.11.0"
clap             = { version = "4.6.7", features = ["derive"] }
ed25519-dalek    = { version = "3.0.0", features = ["zeroize"] }
futures-util     = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom        = { version = "0.4.3", features = ["sys_rng"] }
hkdf             = "0.13.0"
hmac             = "0.13.0"
proptest         = "1.11.0"
rand_core        = "0.10.1"
# TLS uses rustls with the explicit aws-lc-rs provider; ring stays out.
rcgen            = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }
rustls           = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde            = { version = "1.0.229", features = ["derive"] }
serde_json       = "1.0.151"
sha2             = "0.11.0"
thiserror        = "2.0.21"
tokio            = { version = "1.53.2", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls     = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tracing          = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "json", "registry", "std"] }
x25519-dalek     = { version = "3.0.0", features = ["static_secrets", "zeroize"] }
zeroize          = "1.9.0"
