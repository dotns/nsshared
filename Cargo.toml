[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/telemetry",
    "crates/acl",
    "crates/control",
    "crates/tunnel-ws",
]

[workspace.package]
edition = "2024"
rust-version = "1.96"
version = "0.1.0"
license = "MIT"
authors = ["NSIO Project Contributors"]
publish = false

[workspace.dependencies]
# Internal crates.
acl       = { path = "crates/acl" }
common    = { path = "crates/common" }
control   = { path = "crates/control" }
telemetry = { path = "crates/telemetry" }
tunnel-ws = { path = "crates/tunnel-ws" }

# External crates retained from the ns workspace contract.
anyhow = "1"
arc-swap = "1"
async-trait = "0.1"
base64 = "0.22.1"
ciborium = "0.2"
dashmap = "6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures-util = "0.3"
hex = "0.4"
ipnet = { version = "2", features = ["serde"] }
opentelemetry = "0.29"
opentelemetry-prometheus = "0.29"
opentelemetry_sdk = { version = "0.29", features = ["metrics"] }
prometheus = "0.14"
quinn = "0.11"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
snow = "0.9"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry"] }
webpki-roots = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[profile.release-min]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
incremental = false
debug = false

[workspace.metadata.cargo-shear]
# `control` and `tunnel-ws` are consumed by sibling repos through path dependencies cargo-shear cannot see.
ignored = ["control", "tunnel-ws"]
