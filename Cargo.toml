[workspace]
resolver = "3"
members = [
    "crates/nsshared-rendezvous",
    "crates/nsshared-wire",
]

# ============================================================================
# Workspace lint policy (pma-rust baseline). Each crate opts in with
# `[lints] workspace = true`; per-lint test exemptions live in clippy.toml.
# ============================================================================
[workspace.lints.rust]
warnings    = { level = "deny", priority = -2 }
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic       = "deny"
todo        = "warn"

[workspace.package]
edition = "2024"
rust-version = "1.96"
version = "0.1.0"
license = "MIT"
authors = ["NSIO Project Contributors"]
publish = false

[workspace.dependencies]
# Internal crates.
nsshared-wire = { path = "crates/nsshared-wire", version = "0.1.0" }

# External crates: latest stable versions as of 2026-10-02.
base64           = "0.23.1"
blake2           = "0.11.0"
ed25519-dalek    = { version = "3.0.0", features = ["zeroize"] }
hkdf             = "0.13.0"
hmac             = "0.13.0"
proptest         = "1.11.0"
serde            = { version = "1.0.229", features = ["derive"] }
serde_json       = "1.0.151"
sha2             = "0.11.0"
thiserror        = "2.0.21"
x25519-dalek     = { version = "3.0.0", features = ["static_secrets", "zeroize"] }
zeroize          = "1.9.0"
